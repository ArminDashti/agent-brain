services:
  postgres:
    image: postgres:16
    container_name: agent-brain-postgres
    restart: "no"
    environment:
      POSTGRES_USER: agentbrain
      POSTGRES_PASSWORD: agentbrain
      POSTGRES_DB: agent_brain
    ports:
      - "5470:5432"
    volumes:
      - agent_brain_pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: agent-brain-qdrant
    restart: "no"
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - agent_brain_qdrant:/qdrant/storage

volumes:
  agent_brain_pgdata:
  agent_brain_qdrant:
