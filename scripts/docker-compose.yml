name: agent-brain

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: agent-brain-qdrant
    restart: unless-stopped
    networks:
      - default
    volumes:
      - agent_brain_qdrant:/qdrant/storage

  agent-brain-api:
    build:
      context: ../api
      dockerfile: Dockerfile
    image: agent-brain-api:local
    container_name: agent-brain-api
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      ADDR: ":8220"
      SQLITE_PATH: /data/agent_brain.db
      JWT_SECRET: dev-agent-brain-jwt-change-me
      MIGRATIONS_DIR: migrations
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: agent_brain_knowledge
      EMBEDDING_DIM: "64"
    volumes:
      - agent_brain_sqlite:/data
    ports:
      - "5090:8220"
    networks:
      - default

  agent-brain-webui:
    build:
      context: ../webui
      dockerfile: Dockerfile
    image: agent-brain-webui:local
    container_name: agent-brain-webui
    restart: unless-stopped
    depends_on:
      - agent-brain-api
    networks:
      - default
      - pc-armin-local

volumes:
  agent_brain_sqlite:
  agent_brain_qdrant:

networks:
  pc-armin-local:
    external: true
