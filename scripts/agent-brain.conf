# Agent Brain WebUI on host gateway.
# Local: http://agent-brain.local/  (hosts: 127.0.0.1 agent-brain.local)
# Proxies to container agent-brain-webui on pc-armin-local.

server {
    listen 80;
    listen [::]:80;
    server_name agent-brain.local;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $agent_brain_upstream http://agent-brain-webui:80;
        proxy_pass $agent_brain_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }
}
